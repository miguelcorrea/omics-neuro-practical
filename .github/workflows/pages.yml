# Builds the in-browser (WebAssembly) version of the notebook and publishes it to
# GitHub Pages. Enable: Settings -> Pages -> Source: GitHub Actions.
name: Publish notebook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Export notebook to WebAssembly HTML
        run: |
          uvx marimo@0.25.1 export html-wasm sleep_omics.py -o site --mode run --no-show-code
          rm -f site/CLAUDE.md  # editor-assistant file bundled with marimo's assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
